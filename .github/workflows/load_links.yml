name: Cloud Video Ingestion

on:
  workflow_dispatch:
  push:
    paths:
      - "links.txt"

permissions:
  contents: write

# Only one loader may consume the shared queue at a time.
concurrency:
  group: gta-shorts-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout queue
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rclone and yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          python -m pip install --upgrade pip
          pip install requests yt-dlp telethon

      - name: Transfer queued videos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          TG_API_BASE: ${{ secrets.TG_API_BASE }}
        run: python loader.py

      - name: Save remaining retry queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add links.txt
          if git diff --cached --quiet; then
            echo "Queue unchanged."
            exit 0
          fi
          git commit -m "Retain only unprocessed ingestion queue items"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
          done
          echo "Could not persist queue after retries." >&2
          exit 1
