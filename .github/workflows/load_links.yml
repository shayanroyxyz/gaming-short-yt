name: Cloud Video Ingestion

on:
  workflow_dispatch:
  push:
    paths:
      - "links.txt"

permissions:
  contents: write

# Only one loader may consume the shared queue at a time.
concurrency:
  group: gta-shorts-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout queue
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rclone and yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          python -m pip install --upgrade pip
          pip install requests yt-dlp telethon

      - name: Transfer queued videos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          TG_API_BASE: ${{ secrets.TG_API_BASE }}
        run: python loader.py

      - name: Save retry queue without losing concurrent Telegram appends
        run: |
          cp links.txt /tmp/retry_queue.txt
          git show HEAD:links.txt > /tmp/initial_queue.txt
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          from collections import Counter
          from pathlib import Path
          initial = [x.strip() for x in Path("/tmp/initial_queue.txt").read_text().splitlines() if x.strip()]
          latest = [x.strip() for x in Path("links.txt").read_text().splitlines() if x.strip()]
          retries = [x.strip() for x in Path("/tmp/retry_queue.txt").read_text().splitlines() if x.strip()]
          remaining = Counter(initial)
          newly_appended = []
          for item in latest:
              if remaining[item]:
                  remaining[item] -= 1
              else:
                  newly_appended.append(item)
          merged = retries + newly_appended
          Path("links.txt").write_text("".join(item + "\n" for item in merged))
          PY
            git add links.txt
            if git diff --cached --quiet; then
              echo "Queue already current."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Persist ingestion retries and preserve new queue items"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Could not persist queue after retries." >&2
          exit 1
