name: 0-Byte Cloud Video Loader
on:
  workflow_dispatch:
  push:
    paths:
      - "links.txt"

permissions:
  contents: write

concurrency:
  group: cloud-video-loader
  cancel-in-progress: false

jobs:
  load-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rclone, ffmpeg & Telethon
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rclone ffmpeg curl
          pip install -q requests telethon cryptg yt-dlp
      - name: Transfer Video to MEGA & pCloud
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python loader.py
      - name: Update links.txt safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add links.txt
          if ! git diff --staged --quiet; then
            git commit -m "Clear processed queue"
            git push origin HEAD:main
          fi
