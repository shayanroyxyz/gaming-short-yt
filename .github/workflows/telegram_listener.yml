name: Telegram Bot Poller
on:
  push:
    branches: [main]
    paths:
      - 'telegram_bot.py'
      - '.github/workflows/telegram_listener.yml'
      - 'requirements.txt'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: telegram-bot-poller
  cancel-in-progress: true
jobs:
  poll:
    if: github.repository == 'shayanroyxyz/gaming-short-yt'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated bot dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Compile isolated Telegram bot
        run: python -m py_compile telegram_bot.py
      - name: Poll Telegram updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python telegram_bot.py
