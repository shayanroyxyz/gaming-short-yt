name: Telegram Bot Poller

on:
  push:
    branches: [main]
    paths:
      - 'telegram_bot.py'
      - '.github/workflows/telegram_listener.yml'
      - 'requirements.txt'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bot-poller
  cancel-in-progress: true

jobs:
  poll:
    if: github.repository == 'shayanroyxyz/gaming-short-yt'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bot dependencies
        run: |
          python -m pip install --disable-pip-version-check requests google-auth google-api-python-client
      - name: Compile Telegram bot
        run: python -m py_compile telegram_bot.py
      - name: Poll Telegram updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: python telegram_bot.py
