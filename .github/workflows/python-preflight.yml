name: Python Safety Preflight
on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "render_engine.py"
      - "loader.py"
      - "render_bot.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/python-preflight.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "render_engine.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/python-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Compile Python modules
        run: python -m py_compile main.py render_engine.py loader.py
      - name: Run pipeline regression tests
        run: python -m unittest discover -s tests -v
