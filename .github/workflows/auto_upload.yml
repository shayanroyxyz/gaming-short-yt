name: GTA Shorts Commentary Publisher

on:
  schedule:
    # Four runs per day, every 6 hours (UTC). GitHub may delay scheduled runs.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gta-shorts-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install FFmpeg and caption font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate sources and required secrets
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: \${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: \${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: \${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          required = ["GEMINI_API_KEY", "YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit("Missing GitHub Actions secret(s): " + ", ".join(missing))
          lines = [line.strip() for line in Path("sources.txt").read_text().splitlines()
                   if line.strip() and not line.lstrip().startswith("#")]
          if not lines:
              raise SystemExit("Add at least one permitted direct video URL to sources.txt before running.")
          print(f"Secrets present; {len(lines)} source entry/entries configured.")
          PY

      - name: Build and upload Short
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: \${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: \${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: \${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py

      - name: Save render files for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta-shorts-run-\${{ github.run_number }}
          path: |
            final.mp4
            captions.srt
          if-no-files-found: ignore
          retention-days: 3
