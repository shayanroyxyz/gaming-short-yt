name: 24/7 YouTube Auto-Publisher
on:
  schedule:
    - cron: '0 13,17,21,1 * * *'
  workflow_dispatch: 

concurrency:
  group: auto-upload
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core espeak-ng curl nodejs npm
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir auto-editor
      - name: Build PO Token Server
        run: |
          git clone --single-branch --branch 1.1.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          cd bgutil-ytdlp-pot-provider/server/
          npm install
          npx tsc
          node build/main.js &
          sleep 5
      - name: Run pipeline
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          IG_COOKIES:            ${{ secrets.IG_COOKIES }}
          X_COOKIES:             ${{ secrets.X_COOKIES }}
        run: python main.py
