name: 24/7 YouTube Auto-Publisher
on:
  schedule:
    - cron: '0 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch: 
    inputs:
      campaign_url:
        description: 'Campaign Video URL (Optional)'
        required: false
        default: ''
      game_override:
        description: 'Game Name (Optional)'
        required: false
        default: ''
      guidelines:
        description: 'Campaign Rules (Optional)'
        required: false
        default: ''

concurrency:
  group: auto-upload
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core espeak-ng curl nodejs npm
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir auto-editor
      - name: Build PO Token Server
        run: |
          # FIX: Upgraded from 1.1.0 to 1.2.0 to fix the commander-js conflict
          git clone --single-branch --branch 1.2.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          cd bgutil-ytdlp-pot-provider/server/
          # FIX: Added --legacy-peer-deps to bypass strict peer checks
          npm install --legacy-peer-deps
          npx tsc
          node build/main.js &
          sleep 5
      - name: Run pipeline
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CAMPAIGN_URL:          ${{ github.event.inputs.campaign_url }}
          GAME_OVERRIDE:         ${{ github.event.inputs.game_override }}
          GUIDELINES:            ${{ github.event.inputs.guidelines }}
        run: python main.py
