name: 24/7 US Viral Gaming Shorts + IG Reels (6x Daily)
on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 7 * * *'
    - cron: '17 12 * * *'
    - cron: '17 16 * * *'
    - cron: '17 19 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch:
concurrency:
  group: gta-shorts-auto-upload
  cancel-in-progress: false
jobs:
  run-bot:
    if: github.repository == 'shayanroyxyz/gta-shorts-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core rclone
      - run: pip install -q -r requirements.txt
      - env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python main.py
      - run: |
          git config user.name "AutoBot"
          git config user.email "bot@users.noreply.github.com"
          touch history.json config.json
          git add history.json config.json
          if ! git diff --cached --quiet; then
            git commit -m "Log clip history & last video"
          fi
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main || { git rebase --abort || true; sleep 3; continue; }
            if git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git; then
              exit 0
            fi
            sleep 3
          done
          echo "Failed to persist history/config after 3 attempts." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Notify Telegram when workflow fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          if token and chat:
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={"chat_id": chat, "text": "⚠️ GitHub Actions pipeline failed. Open the run log: " + os.environ["RUN_URL"]},
                  timeout=15
              )
          PY
