name: 24/7 YouTube Auto-Publisher
on:
  schedule:
    # 8 runs daily (every 3 hours across USA peak cycles)
    - cron: '0 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch: 
    inputs:
      campaign_url:
        description: 'Source URL (Video to clip)'
        required: false
        default: ''
      game_override:
        description: 'Game / Niche (e.g. CoD MW4, WoW, Roblox, Playnaut)'
        required: false
        default: ''
      campaign_rules:
        description: 'Mandatory Hashtags / Disclosures (e.g. #Sponsored #playpulp)'
        required: false
        default: ''
      clip_length:
        description: 'Target duration in seconds (default: 25)'
        required: false
        default: '25'

concurrency:
  group: auto-upload
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8 # Kills job automatically if stuck to save quota
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core espeak-ng curl nodejs npm
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir auto-editor
      - name: Build PO Token Server
        run: |
          git clone --single-branch --branch 1.1.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git
          cd bgutil-ytdlp-pot-provider/server/
          npm install
          npx tsc
          node build/main.js &
          sleep 4
      - name: Run pipeline
        env:
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CAMPAIGN_URL:          ${{ github.event.inputs.campaign_url }}
          GAME_OVERRIDE:         ${{ github.event.inputs.game_override }}
          CAMPAIGN_RULES:        ${{ github.event.inputs.campaign_rules }}
          CLIP_LENGTH:           ${{ github.event.inputs.clip_length }}
        run: python main.py
