name: 24/7 US Viral Gaming Shorts + IG Reels (6x Daily)
on:
  # Process Telegram/URL queue as soon as the bot commits a new queue entry.
  push:
    branches: [main]
    paths:
      - links.txt
  # Six daily runs at 9 AM, 12 PM, 3 PM, 6 PM, 9 PM and 12 AM
  # US Eastern time. IANA timezone keeps these local times aligned across DST.
  schedule:
    - cron: '17 9 * * *'
      timezone: "America/New_York"
    - cron: '17 12 * * *'
      timezone: "America/New_York"
    - cron: '17 15 * * *'
      timezone: "America/New_York"
    - cron: '17 18 * * *'
      timezone: "America/New_York"
    - cron: '17 21 * * *'
      timezone: "America/New_York"
    - cron: '17 0 * * *'
      timezone: "America/New_York"
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: gta-shorts-auto-upload
  cancel-in-progress: false
jobs:
  run-bot:
    if: github.repository == 'shayanroyxyz/gta-shorts-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg, fonts and official rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl
          curl --proto '=https' --tlsv1.2 -sSf https://rclone.org/install.sh | sudo bash
          rclone version
          rclone help backends | grep -i mega
      - run: pip install -q -r requirements.txt
      - name: Verify GitHub write access before publishing
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT repository secret is missing. Add a fine-grained token with Contents: Read and write before publishing."
            exit 1
          fi
          if ! git push --dry-run origin HEAD:main; then
            echo "::error::GH_PAT could not verify write access. Check its repository selection and Contents permission."
            exit 1
          fi
      - name: Drain pending Telegram and URL queue before rendering
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -s links.txt ] && grep -q '|' links.txt; then
            python -m pip install -q telethon cryptg yt-dlp
            python loader.py
          else
            echo "No queued links to drain."
          fi
      - env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python main.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch history.json config.json links.txt
          git add history.json config.json links.txt
          if ! git diff --cached --quiet; then
            git commit -m "Log clip history & last video"
          fi
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$BRANCH" || { git rebase --abort || true; sleep 3; continue; }
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 3
          done
          echo "Failed to persist history/config after 3 attempts." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Notify Telegram when workflow fails
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          if token and chat:
              requests.post(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data={"chat_id": chat, "text": "⚠️ GitHub Actions pipeline failed. Open the run log: " + os.environ["RUN_URL"]},
                  timeout=15
              )
          PY
