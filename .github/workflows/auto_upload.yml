name: 24/7 US Prime-Time 6x Daily Publisher
on:
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 7 * * *'
    - cron: '17 12 * * *'
    - cron: '17 16 * * *'
    - cron: '17 19 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install --upgrade google-api-python-client google-auth-oauthlib google-genai yt-dlp[default] edge-tts requests
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python main.py
