name: FFmpeg Render Preflight
on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "render_engine.py"
      - "loader.py"
      - "telegram_bot.py"
      - "analytics_tuner.py"
      - "requirements.txt"
      - ".github/workflows/render_preflight.yml"

permissions:
  contents: read

jobs:
  python-and-ffmpeg:
    if: github.repository == 'shayanroyxyz/gaming-short-yt'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1
      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile all pipeline Python files
        run: |
          python -m py_compile main.py render_engine.py loader.py telegram_bot.py analytics_tuner.py
          echo "PY_COMPILE_OK: all five Python files compiled."
      - name: Run synthetic 1080x1920 FFmpeg render test
        run: |
          python render_engine.py --self-test
