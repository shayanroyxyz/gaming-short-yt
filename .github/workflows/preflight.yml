name: Pipeline preflight tests
on:
  push:
    branches:
      - "**"
  pull_request:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Verify official rclone includes MEGA backend
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl
          curl --proto '=https' --tlsv1.2 -sSf https://rclone.org/install.sh | sudo bash
          rclone version
          rclone help backends | grep -i mega
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile every Python module
        run: python -m compileall -q .
      - name: Run pipeline regression tests
        run: python -m unittest discover -s tests -v
