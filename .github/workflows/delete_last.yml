name: Delete Last Recorded Short
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gaming-short-delete-last
  cancel-in-progress: false
jobs:
  delete:
    if: github.repository == 'shayanroyxyz/gaming-short-yt'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check google-auth google-api-python-client
      - name: Delete last recorded Short (only after explicit button tap)
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          p=Path("config.json")
          cfg=json.loads(p.read_text()) if p.exists() else {}
          vid=str(cfg.get("last_video_id","")).strip()
          if not vid:
              print("No last_video_id recorded; nothing to delete.")
              raise SystemExit(0)
          c=Credentials(token=None,refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              client_id=os.environ["YOUTUBE_CLIENT_ID"],client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              token_uri="https://oauth2.googleapis.com/token")
          build("youtube","v3",credentials=c,cache_discovery=False).videos().delete(id=vid).execute()
          cfg["last_deleted_video_id"]=vid
          cfg["last_video_id"]=""
          p.write_text(json.dumps(cfg,indent=2)+"\\n")
          print("YouTube accepted deletion of the last recorded Short.")
          PY
      - name: Persist deletion state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          if ! git diff --cached --quiet; then
            git commit -m "Record last Short deletion"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
